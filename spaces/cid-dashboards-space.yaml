# Shared Space for the launch-library agents (operations, finops, security).
# Loaded via dashboards/catalog.yaml like any dashboard resource file.
# Dashboard keys are split into
# Required (dependsOn.dashboards) and Optional (dependsOn.optionalDashboards);
# every key exists in the core catalog (referential completeness).
spaces:
  cid-dashboards-space:
    name: CID Dashboards Space
    description: >-
      Comprehensive knowledge base for the Cloud Intelligence Dashboards,
      shared by the CID launch-library agents.
    dependsOn:
      dashboards: [CUDOSv5, CID, KPI]            # Required: foundational dashboards
      optionalDashboards: [Trends]               # Optional: additional trend/anomaly dashboard
      datasets: []                               # dataset knowledge is declared per agent
